[project]
name = "study-planner"
version = "0.1.0"
description = "A Bayesian study planner with calendar integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.0.0",
    "pgmpy>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=14.0.0",
    "typer>=0.29.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project.scripts]
study-planner = "study_planner.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
